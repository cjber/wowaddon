name: Binary checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  binary:
    name: binary-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # A Bun that writes a newer bun.lock lockfileVersion needs Dependabot support first (see dependabot.yml).
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - env:
          ARCH: ${{ matrix.arch }}
        run: bun scripts/build.ts "$ARCH"
      - name: Exercise the native executable outside the checkout
        env:
          ARCH: ${{ matrix.arch }}
        run: bun scripts/smoke-binary.ts "dist/wowaddon-linux-$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wowaddon-linux-${{ matrix.arch }}
          path: dist/wowaddon-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
