name: Feature
description: Suggest a source, command or change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible to do today.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: What must be left alone
      description: Folders, files or cases wowaddon must not touch.
