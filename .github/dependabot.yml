version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # bun.lock is lockfileVersion 2 (Bun 1.4). Dependabot reads versions 2 and 3 from
  # dependabot-core v0.400.0 (2026-10-12) onward; older runs failed with "Unsupported
  # bun.lock 'lockfileVersion' 2". Before moving CI to a Bun that writes a newer
  # lockfileVersion, check that Dependabot reads it.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns: ["*"]
